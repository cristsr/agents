# Mapping of provider-agnostic agents → each provider's native format.
#
# The agents (agents/*.md) name no models and no tools: they declare a
# `tier` and a list of `capabilities`. This file translates both into each
# tool's vocabulary. Changing model = changing one cell here.
#
# Sync with:  npm run agents:sync        (preview: npm run agents:check)

version: 1

targets:
  # ─────────────────────────────────────────────────────────────────────────
  claude-code:
    enabled: true
    out: ~/.claude/agents/{name}.md
    format: claude-code

    # tier → model alias. Claude Code resolves the alias to the concrete id
    # per the active provider (Anthropic direct, Bedrock, Vertex).
    tiers:
      reasoning: opus
      balanced: sonnet
      fast: haiku

    # capability → native tools (allowlist: what isn't declared isn't granted)
    capabilities:
      read: [Read]
      search: [Grep, Glob]
      shell: [Bash]
      skills: [Skill]
      edit: [Edit, Write]
      web: [WebFetch, WebSearch]
      agents: [Agent]

    # Implementation of each guard in this provider.
    guards:
      # Bash allowed, but every command goes through a validator that fails
      # CLOSED: if it can't parse the command, it blocks it.
      shell:readonly:
        hooks:
          PreToolUse:
            - matcher: 'Bash'
              hooks:
                - type: command
                  command: 'node C:/Users/styve/.claude/scripts/validate-readonly-bash.js'

  # ─────────────────────────────────────────────────────────────────────────
  opencode:
    enabled: true
    out: ~/.config/opencode/agents/{name}.md
    format: opencode

    # This OpenCode runs against a local LM Studio (see opencode.json), not
    # against Anthropic — which is why the tiers resolve to completely different
    # models than in claude-code. With only two local models, `reasoning` and
    # `balanced` collapse into the same one: adjust when a larger local model exists.
    tiers:
      reasoning: lmstudio/qwen/qwen3.5-9b
      balanced: lmstudio/qwen/qwen2.5-coder-7b
      fast: lmstudio/qwen/qwen2.5-coder-7b

    # capability → native tools (object of booleans)
    capabilities:
      read: { read: true }
      search: { grep: true, glob: true }
      shell: { bash: true }
      skills: { skill: true }
      edit: { edit: true, write: true }
      web: { webfetch: true }
      agents: { task: true }

    # What isn't declared is emitted explicitly as false, rather than omitted.
    # OpenCode enables everything by default: omitting would be granting.
    # Verified with `opencode debug agent <name>`: anything not listed here stays
    # enabled by default. `invalid` and `question` are handled by OpenCode itself.
    deny_unlisted: true
    known_tools: [read, grep, glob, bash, skill, edit, write, webfetch, task, patch, todowrite]

    defaults:
      mode: subagent

    guards:
      # OpenCode has no hooks. The best available translation is a pattern
      # allowlist with deny by default: it is NOT equivalent to claude-code's
      # validator (which inspects the whole command), it's a more restrictive
      # approximation. Add patterns here if an agent needs them.
      shell:readonly:
        permission:
          bash:
            '*': deny
            'git status*': allow
            'git log*': allow
            'git diff*': allow
            'git branch*': allow
            'ls*': allow
            'rg*': allow
            'find*': allow
            'cat*': allow
