# Mapping of provider-agnostic agents → each provider's native format.
#
# The agents (agents/*.md) name no models and no tools: they declare a
# `tier` and a list of `capabilities`. This file translates both into each
# tool's vocabulary. Changing model = changing one cell here.
#
# Sync with:  npm run agents:sync        (preview: npm run agents:check)

version: 1

targets:
  # ─────────────────────────────────────────────────────────────────────────
  claude-code:
    enabled: true
    out: ~/.claude/agents/{name}.md
    format: claude-code

    # tier → model alias. Claude Code resolves the alias to the concrete id
    # per the active provider (Anthropic direct, Bedrock, Vertex).
    tiers:
      reasoning: opus
      balanced: sonnet
      fast: haiku

    # capability → native tools (allowlist: what isn't declared isn't granted)
    capabilities:
      read: [Read]
      search: [Grep, Glob]
      shell: [Bash]
      skills: [Skill]
      edit: [Edit, Write]
      web: [WebFetch, WebSearch]
      agents: [Agent]

    # Implementation of each guard in this provider.
    guards:
      # Bash allowed, but every command goes through a validator that fails
      # CLOSED: if it can't parse the command, it blocks it.
      shell:readonly:
        hooks:
          PreToolUse:
            - matcher: 'Bash'
              hooks:
                - type: command
                  command: 'node C:/Users/styve/.claude/scripts/validate-readonly-bash.js'

  # ─────────────────────────────────────────────────────────────────────────
  opencode:
    enabled: true
    out: ~/.config/opencode/agents/{name}.md
    format: opencode

    # This OpenCode runs against the DeepSeek API (see opencode.json), not
    # against Anthropic — which is why the tiers resolve to completely different
    # models than in claude-code. Three API models today: `reasoning` is the
    # reasoner, `balanced` the general chat model, `fast` the flash model.
    tiers:
      reasoning: deepseek/deepseek-reasoner
      balanced: deepseek/deepseek-chat
      fast: deepseek/deepseek-v4-flash

    # capability → native tools (object of booleans).
    # Note: there is deliberately NO `write` capability — OpenCode treats `edit`
    # as the master switch: a standalone `write: allow` with `edit: deny` does not
    # enable Write (verified on 1.18.3). Write-without-edit is not expressible, so
    # a write-only agent still declares `edit` and enforces the restriction in its
    # prompt.
    capabilities:
      read: { read: true }
      search: { grep: true, glob: true }
      shell: { bash: true }
      skills: { skill: true }
      edit: { edit: true, write: true }
      web: { webfetch: true }
      agents: { task: true }

    # What isn't declared is emitted as a `deny` rule, rather than omitted.
    # OpenCode enables everything by default: omitting would be granting.
    # Emitted via the `permission` field — NOT the deprecated `tools` field,
    # which in some OpenCode versions fails to enable `edit`/`write`
    # (verified on 1.18.3). Verified with `opencode debug agent <name>`:
    # anything not listed here stays enabled by default, so deny_unlisted
    # closes that gap. `patch` is not a permission key (it errored), so it is
    # excluded from known_tools. `invalid` and `question` are handled by
    # OpenCode itself.
    deny_unlisted: true
    known_tools: [read, grep, glob, bash, skill, edit, write, webfetch, task, todowrite]

    defaults:
      mode: subagent

    guards:
      # OpenCode has no hooks. The best available translation is a pattern
      # allowlist with deny by default: it is NOT equivalent to claude-code's
      # validator (which inspects the whole command), it's a more restrictive
      # approximation. Add patterns here if an agent needs them.
      shell:readonly:
        permission:
          bash:
            '*': deny
            'git status*': allow
            'git log*': allow
            'git diff*': allow
            'git branch*': allow
            'ls*': allow
            'rg*': allow
            'find*': allow
            'cat*': allow
